<!doctype html>
<html lang="id">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Offline · Desk</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        background: #f5f5f7;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        color: #1d1d1f;
        padding: 24px;
      }
      .card {
        max-width: 380px;
        background: #fff;
        border: 1px solid #e5e7eb;
        border-radius: 20px;
        padding: 32px;
        text-align: center;
      }
      .mark {
        width: 48px; height: 48px; margin: 0 auto 16px;
        border-radius: 14px; background: #4f46e5;
        display: grid; place-items: center; color: #fff; font-weight: 700;
      }
      h1 { font-size: 20px; margin: 0 0 8px; }
      p { color: #6b7280; font-size: 14px; line-height: 1.6; margin: 0 0 20px; }
      button {
        background: #4f46e5; color: #fff; border: 0; border-radius: 10px;
        padding: 12px 18px; font-size: 14px; font-weight: 600; cursor: pointer;
      }
      @media (prefers-color-scheme: dark) {
        body { background: #0a0a0a; color: #f5f5f7; }
        .card { background: #161618; border-color: #2a2a2e; }
        p { color: #a1a1aa; }
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">PD</div>
      <h1>Anda sedang offline</h1>
      <p>Periksa koneksi internet Anda. Halaman yang sudah dimuat sebelumnya mungkin masih bisa dibuka.</p>
      <button onclick="location.reload()">Coba lagi</button>
    </div>
  </body>
</html>
